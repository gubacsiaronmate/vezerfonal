<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="hu">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ellenőrző kód</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            max-width: 480px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .header {
            background-color: #1a1a2e;
            padding: 28px 32px;
        }
        .header h1 {
            margin: 0;
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .body {
            padding: 32px;
        }
        .body p {
            color: #444444;
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 24px 0;
        }
        .code-box {
            background-color: #f0f0f5;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }
        .code-box span {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: 10px;
            color: #1a1a2e;
        }
        .footer {
            border-top: 1px solid #eeeeee;
            padding: 20px 32px;
        }
        .footer p {
            color: #999999;
            font-size: 12px;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Vezérfonal</h1>
    </div>
    <div class="body">
        <p>Az alábbi kódot add meg a jelszómódosítás befejezéséhez:</p>
        <div class="code-box">
            <span th:text="${code}">000000</span>
        </div>
        <p>Ha nem te kérted ezt a kódot, hagyd figyelmen kívül ezt az e-mailt. A fiókod biztonságos.</p>
    </div>
    <div class="footer">
        <p>Ezt az üzenetet a Vezérfonal rendszer küldte automatikusan. Kérjük, ne válaszolj erre az e-mailre.</p>
    </div>
</div>
</body>
</html>
